  # Resimlerimizi buraya ekliyoruz. 
  # Dosya isimlerinin assets klasöründekilerle birebir aynı olması çok önemli!
  assets:
    - assets/orman_bg.png
    - assets/okyanus_bg.png
    - assets/gece_bg.png